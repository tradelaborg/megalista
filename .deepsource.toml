
version = 1

test_patterns = [
    "tests/**",
    "test/**",
    "e2e/**",
    "**/tests/**",
    "**/test/**",
    "**/test_*.*",
    "**/*.spec.ts"
]

exclude_patterns = [
    "**/migrations/**",
    "tests/**",
    "test/**",
    "e2e/**",
    "database/**",
    "databases/**",
    "**/tests/**",
    "**/test/**",
    "**/test_*.*",
    "**/*.spec.ts",
    "**/*.test.ts"
]

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "test-coverage"
enabled = false

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "shell"
enabled = true
    
[[analyzers]]
name = "terraform"
enabled = true
        
[[analyzers]]
name = "python"
enabled = true

[analyzers.meta]
runtime_version = "3.x.x"
        